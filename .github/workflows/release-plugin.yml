name: Release Plugin

on:
  push:
    branches: [main]
    paths:
      - 'src/wordpress-plugin/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from plugin header
        id: version
        run: |
          VERSION=$(grep -m1 '^\s*\*\s*Version:' src/wordpress-plugin/sentinel-idpy-connector.php \
            | sed 's/.*Version:\s*//' | tr -d ' \r\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package plugin zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd src
          zip -r wordpress-plugin.zip wordpress-plugin/
          echo "Packaged: $(ls -lh wordpress-plugin.zip | awk '{print $5}')"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SentinelIDPY Connector v${{ steps.version.outputs.version }}
          body: |
            Actualización automática del plugin SentinelIDPY Connector.
            Los sitios WordPress con el plugin instalado recibirán la notificación de actualización en el panel de administración.
          files: src/wordpress-plugin.zip
          make_latest: true
